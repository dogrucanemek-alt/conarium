name: node-matrix

# package.json used to declare `engines: node >=18` while CI verified exactly one
# of the majors that range covers. A reviewer running the suite on Node 24 pointed
# that out; nothing was broken, and nothing was checked either, which is the same
# defect as a claim nobody re-reads.
#
# Checking it produced two findings rather than none:
#
#   1. Node 18 does not work. The MCP SDK's HTTP transport calls the global
#      `crypto`, which is available without a flag only from Node 19. On 18 the
#      gateway fails at `initialize` with `ReferenceError: crypto is not defined`.
#      38 of 39 checks passed there; the one that failed is a real runtime
#      failure, not a test artefact. `engines` was raised to >=20 rather than
#      papered over with a polyfill for a dependency's requirement.
#
#   2. Node 18 and Node 20 are both past end-of-life (2025-04-30 and 2026-04-30 in
#      the nodejs/Release schedule). A product about governance should not quietly
#      invite a runtime that no longer receives security patches. Node 20 is kept
#      as the floor because it is verified to work and dropping it would break
#      installations for a reason they did not ask for — but that it is EOL is
#      stated in LIMITATIONS rather than left for the reader to discover.
#
# So the matrix is the versions the declared range covers, and every one of them
# is actually exercised. If a version fails here, the honest options are to fix it
# or to move the floor — not to narrow the matrix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide the others: the useful result is which
      # majors differ, and fail-fast would report only the first.
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks
      # The first-run path exactly as the README prints it. A suite that passes
      # while `conarium-init` is broken would still leave a new user stuck at the
      # first command, so the documented path is checked on every major too.
      #
      # The export is part of the path, not boilerplate: init writes the key and
      # then prints the two exports and the doctor line, and doctor exits 1 when a
      # receipt sink is configured with no signing key — correctly, since a gateway
      # in that state cannot sign what it records. The first version of this step
      # omitted the export and failed on all three majors, which is the check
      # doing its job on the person who wrote it.
      - name: Documented quickstart
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quickstart" && cd "$RUNNER_TEMP/quickstart"
          node "$GITHUB_WORKSPACE/bin/conarium-init.mjs"
          test -f conarium.config.json
          test -f audit-ed25519.pem.keyid
          export CONARIUM_AUDIT_SIGNING_KEY="$PWD/audit-ed25519.pem"
          export CONARIUM_AUDIT_TRUST_PUBKEYS="$PWD/audit-ed25519.pub.pem"
          node "$GITHUB_WORKSPACE/bin/conarium-doctor.mjs" --config ./conarium.config.json --no-net

  # Every step above runs the code from a checkout. A reader runs it from the
  # tarball, and the two are not the same thing: a path that resolves in the
  # repository can be absent, unexecutable, or unregistered in the package.
  #
  # This job installs the packed tarball into an empty directory, the way a
  # stranger does, and asserts that every command the package says it installs
  # can be resolved without asking the registry. The list is read from the
  # installed package.json, because restating it here would recreate the drift.
  #
  # It is worth being exact about what this does and does not catch, since the
  # defect that prompted it was the other direction. On 2026-08-17 the README
  # documented `npx conarium-anchor-service`; the file was present, shipped, and
  # correct, but the name was never listed in package.json "bin", so npm looked
  # for a package by that name and answered E404. A loop over "bin" cannot see
  # that — an unregistered name is not in the list it iterates. That direction
  # (documented ⇒ registered) is checked offline by test/bin_claims.mjs. This job
  # checks the opposite direction (registered ⇒ actually resolvable once
  # installed), which no repository-local test can establish. Both are needed.
  stranger-install:
    name: stranger-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and install into an empty directory
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/stranger" && cd "$RUNNER_TEMP/stranger"
          npm init -y > /dev/null
          npm i "$RUNNER_TEMP"/conarium-ai-core-*.tgz
      - name: Every installed command resolves through npx
        # The default step shell is `bash -e`, so the first non-zero exit ends the
        # step. Here a non-zero exit is the expected answer for nearly every
        # command — they refuse to run without configuration, which is the point —
        # so errexit is off and the verdict comes from the output. Left on, this
        # step died on the very first command having reported nothing at all,
        # which is how it failed the first time it ran.
        run: |
          set -uo pipefail
          set +e
          # With errexit off, a failed cd would leave the loop checking whatever
          # directory it happened to be in and still report every command ok.
          cd "$RUNNER_TEMP/stranger" || { echo "::error::install directory missing"; exit 1; }
          names=$(node -e 'console.log(Object.keys(require("./node_modules/@conarium-ai/core/package.json").bin).join("\n"))')
          if [ -z "$names" ]; then
            echo "::error::no bin entries were read from the installed package"
            exit 1
          fi
          echo "checking: $(echo "$names" | tr '\n' ' ')"
          failed=0
          for n in $names; do
            # Servers block by design, so the run is bounded. The verdict is not
            # the exit code — a command that refuses to start without its key is
            # behaving correctly — it is whether npx had to ask the registry.
            timeout 20 npx --no-install "$n" --help > out.txt 2>&1
            code=$?
            if grep -qE "E404|is not in this registry|could not determine executable" out.txt; then
              echo "::error::npx could not resolve '$n' — missing from package.json \"bin\"?"
              head -5 out.txt
              failed=1
            else
              echo "  ok  $n (exit $code, resolved locally)"
            fi
          done
          exit $failed
