name: node-matrix

# package.json used to declare `engines: node >=18` while CI verified exactly one
# of the majors that range covers. A reviewer running the suite on Node 24 pointed
# that out; nothing was broken, and nothing was checked either, which is the same
# defect as a claim nobody re-reads.
#
# Checking it produced two findings rather than none:
#
#   1. Node 18 does not work. The MCP SDK's HTTP transport calls the global
#      `crypto`, which is available without a flag only from Node 19. On 18 the
#      gateway fails at `initialize` with `ReferenceError: crypto is not defined`.
#      38 of 39 checks passed there; the one that failed is a real runtime
#      failure, not a test artefact. `engines` was raised to >=20 rather than
#      papered over with a polyfill for a dependency's requirement.
#
#   2. Node 18 and Node 20 are both past end-of-life (2025-04-30 and 2026-04-30 in
#      the nodejs/Release schedule). A product about governance should not quietly
#      invite a runtime that no longer receives security patches. Node 20 is kept
#      as the floor because it is verified to work and dropping it would break
#      installations for a reason they did not ask for — but that it is EOL is
#      stated in LIMITATIONS rather than left for the reader to discover.
#
# So the matrix is the versions the declared range covers, and every one of them
# is actually exercised. If a version fails here, the honest options are to fix it
# or to move the floor — not to narrow the matrix.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing must not hide the others: the useful result is which
      # majors differ, and fail-fast would report only the first.
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks
      # The first-run path exactly as the README prints it. A suite that passes
      # while `conarium-init` is broken would still leave a new user stuck at the
      # first command, so the documented path is checked on every major too.
      - name: Documented quickstart
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quickstart" && cd "$RUNNER_TEMP/quickstart"
          node "$GITHUB_WORKSPACE/bin/conarium-init.mjs"
          test -f conarium.config.json
          test -f audit-ed25519.pem.keyid
          node "$GITHUB_WORKSPACE/bin/conarium-doctor.mjs" --config ./conarium.config.json --no-net
