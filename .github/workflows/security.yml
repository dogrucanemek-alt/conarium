name: ci

# Her push + PR'da deterministik kapı:
#  - build + lint (tsc --noEmit) + test (vitest) + test:checks (adversarial .mjs)
#  - Semgrep: kod deseni / injection / kripto / auth-misuse
#  - Gitleaks: koda gömülü sır / anahtar
# AI incelemesinin (agy/Claude) kör noktasını kapatır. Katmanlı savunma.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks
      # Gitleaks runs HERE, not as its own job. As a third parallel job it never
      # got a runner — queued indefinitely on two separate runs, then cancelled,
      # with no steps ever created. Two jobs start reliably; a third did not.
      # It costs ~0.1s on this tree, so a dedicated job bought nothing anyway.
      #
      # Pinned binary instead of gitleaks/gitleaks-action@v2: that action also
      # scanned only the pushed diff, so anything already in the tree was never
      # checked. Same binary version locally and in CI = reproducible result.
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Whole working tree, not the diff. --redact so a finding never prints the
      # value it found into a public build log.
      - name: Gitleaks (secret scan, whole tree)
        run: ./gitleaks dir . -c .gitleaks.toml --redact --no-banner

  semgrep:
    name: Semgrep (static security)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/security-audit --config p/secrets --config p/javascript --config p/typescript --error
        # Hard-gates on any finding. .semgrepignore drops generated/marketing/test
        # noise; the product code (src/, api/) scans clean (verified: 0 findings).
