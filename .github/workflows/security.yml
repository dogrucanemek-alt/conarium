name: ci

# Her push + PR'da deterministik kapı:
#  - build + lint (tsc --noEmit) + test (vitest) + test:checks (adversarial .mjs)
#  - Semgrep: kod deseni / injection / kripto / auth-misuse
#  - Gitleaks: koda gömülü sır / anahtar
# AI incelemesinin (agy/Claude) kör noktasını kapatır. Katmanlı savunma.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks

  semgrep:
    name: Semgrep (static security)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/security-audit --config p/secrets --config p/javascript --config p/typescript --error
        # Hard-gates on any finding. .semgrepignore drops generated/marketing/test
        # noise; the product code (src/, api/) scans clean (verified: 0 findings).

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned binary instead of gitleaks/gitleaks-action@v2. That action hung
      # this job for two days — first "Failed to resolve action download info:
      # Service Unavailable", then queued with no runner — which left the whole
      # run showing as `queued` and the repo looking like CI never ran. It also
      # scanned only the pushed diff, so nothing already in the tree was ever
      # checked. A pinned release + checksum is one less moving part, and the
      # version is reproducible: same binary locally and in CI.
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Scans the whole working tree, not just the diff. --redact so a finding
      # never prints the value it found into a public build log.
      - name: Scan working tree
        run: ./gitleaks dir . -c .gitleaks.toml --redact --no-banner
