name: ci

# Her push + PR'da deterministik kapı:
#  - build + lint (tsc --noEmit) + test (vitest) + test:checks (adversarial .mjs)
#  - Semgrep: kod deseni / injection / kripto / auth-misuse
#  - Gitleaks: koda gömülü sır / anahtar
# AI incelemesinin (agy/Claude) kör noktasını kapatır. Katmanlı savunma.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # gecmis taramasi icin sart — sig klon "temiz" yalani soyler
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks
      # Bagimlilik kapisi. 2026-08-12'de uretim agacinda 6 KRITIK acik vardi ve
      # hicbir test bunu gormedi — testler kodu olcer, bagimlilik agacini olcmez.
      # Hepsi tek kaynaktan geliyordu: javascript-opentimestamps -> request (SSRF,
      # paket terk edilmis, duzeltme yok) / web3 / crypto-js. Cipalama opsiyonel bir
      # ek oldugu icin paket opsiyonel peer'a tasindi; cekirdegi kuran artik o
      # agaci hic indirmiyor. Bu kapi, ayni seyin sessizce geri gelmesini engeller.
      #
      # --omit=dev bilerek: dev araclarinin (vitest/vite) acigi musteriye kurulmaz.
      # Kapsam dogru olsun diye daraltildi, sonuc guzellesmesi icin degil.
      - name: npm audit (production tree, high+ blocks)
        run: npm audit --omit=dev --audit-level=high
      # Gitleaks runs HERE, not as its own job. As a third parallel job it never
      # got a runner — queued indefinitely on two separate runs, then cancelled,
      # with no steps ever created. Two jobs start reliably; a third did not.
      # It costs ~0.1s on this tree, so a dedicated job bought nothing anyway.
      #
      # Pinned binary instead of gitleaks/gitleaks-action@v2: that action also
      # scanned only the pushed diff, so anything already in the tree was never
      # checked. Same binary version locally and in CI = reproducible result.
      # --retry: indirme 2026-08-12'de curl 56 (connection died) ile dustu ve BUTUN
      # kapi kirmizi yandi — testler, lint, Semgrep, CodeQL hepsi gecmisti. Yani
      # gecici bir ag arizasi "guvenlik kapisi basarisiz" diye raporlandi.
      # Ayni gun dogrulayicida duzelttigimiz hatanin CI seviyesindeki hali:
      # "ulasamadim" ile "basarisiz" ayni sey degil. Burada dogru cevap kodu
      # yumusatmak DEGIL (indirilemeyen tarayici gercekten kosmamis demektir),
      # once tekrar denemek.
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 20 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Whole working tree, not the diff. --redact so a finding never prints the
      # value it found into a public build log.
      - name: Gitleaks (secret scan, whole tree)
        run: ./gitleaks dir . -c .gitleaks.toml --redact --no-banner
      # Calisma agaci != gecmis. `dir` yalnizca BUGUNKU dosyalari gorur; bir sir
      # eklenip sonraki commit'te silinseydi agac temiz gorunur, gecmiste durmaya
      # devam ederdi — ve halka acik bir repoda silinmis sey silinmis degildir.
      # Gecmis ilk kez 2026-08-12'de tarandi (65 commit): bulunan 7 sey de olu
      # cikti, gerekcesi .gitleaks.toml ve SECURITY.md'de. Bu adim, bir dahakini
      # eklendigi gun yakalar.
      - name: Gitleaks (full git history)
        run: ./gitleaks git . -c .gitleaks.toml --redact --no-banner
      # fetch-depth: 0 olmadan checkout tek commit alir ve gecmis taramasi
      # bos bir agaci "temiz" ilan ederdi — olcumun kendi arizasina kor olmasi.

  # CodeQL: Semgrep desen esler, CodeQL veri akisi izler. Farkli seyler bulurlar —
  # "kullanicidan gelen deger su hassas cagriya ULASIYOR mu" sorusunu yalnizca ikincisi
  # cevaplayabilir. Public repoda ucretsiz; bulgular Security sekmesinde durur, yani
  # disaridan bakan biri sonucu bizim beyanimiza guvenmeden kendisi gorebilir.
  codeql:
    name: CodeQL (dataflow analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Test fixtures are hostile by design; scanning them reported the
          # fixture as the finding. src/ and api/ stay in scope.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

  semgrep:
    name: Semgrep (static security)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: semgrep scan --config p/security-audit --config p/secrets --config p/javascript --config p/typescript --error
        # Hard-gates on any finding. .semgrepignore drops generated/marketing/test
        # noise; the product code (src/, api/) scans clean (verified: 0 findings).
