# Weekly longer fuzz. Same targets as the PR job, larger budget.
name: fuzz-batch

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jazzer:
    name: Jazzer.js (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fuzz four targets
        env:
          FUZZ_SECONDS: "600"
        run: node fuzz/run.mjs
      - name: Surface crash inputs
        if: failure()
        run: |
          find . -maxdepth 3 \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' \) -print -exec sh -c 'echo "----- $1 -----"; xxd "$1" | head -40' _ {} \;
