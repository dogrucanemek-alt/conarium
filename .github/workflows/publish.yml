# npm provenance publish — prepared, not wired to push.
# First use is a patron + Claude decision. This file does not publish on its own.
#
# Auth is npm Trusted Publishing (OIDC): npmjs.com must list this repo and this
# workflow as a trusted publisher for @conarium-ai/core. No token is stored here.
# A long-lived publish token in repo secrets would be one more secret to leak,
# and npm is restricting 2FA-bypassing tokens for direct publishing anyway.
# Verify after a release: see docs/security/NPM-PROVENANCE.md
name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        # `registry` exists because the two publishes are not one operation. The
        # npm release is irreversible; the registry entry is metadata that can be
        # retried. When 0.2.25 published to npm and then failed at the registry,
        # re-running the whole workflow was impossible — npm refuses a duplicate
        # version — so the only way to fix a metadata entry would have been to
        # burn a version number on it.
        description: 'publish = release the version in package.json; registry = MCP registry entry only'
        required: true
        type: string

# Read at the top of the file, write only inside the job that needs it. The
# difference is not cosmetic: a top-level grant is handed to every job the file
# grows later, including one added by a pull request that nobody read closely.
permissions:
  contents: read

jobs:
  npm:
    if: ${{ github.event.inputs.confirm == 'publish' || github.event.inputs.confirm == 'registry' }}
    runs-on: ubuntu-latest
    permissions:
      # write, not read: a successful publish pushes its own v<version> tag and
      # creates the release below. The job is manual-dispatch only and gated by
      # the confirm input.
      contents: write
      # npm Trusted Publishing and sigstore both exchange this identity for a
      # short-lived credential. Nothing is stored in repo secrets.
      id-token: write
      # Writes the build attestation for the release tarball.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Checkout fetches no tags by default — the run log for 32036864594
          # reads `fetch-tags: false` and `--depth=1`. The tag steps below ask
          # whether v<version> already exists, and in a clone with no tags that
          # question was always answered "no", so the guard could not fire in
          # the one case it was written for.
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted Publishing needs npm >= 11.5, and current npm majors no
          # longer run on Node 20. The published package still supports the
          # engines range in package.json; this is only the release runner.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:checks
      # A judgment gate, not a test. The checks above lock phrasings that were
      # already caught, and none of them can see a new overclaim: on 2026-08-17
      # privacy.html asserted "we never receive, see, or store your data" four
      # paragraphs above its own inventory of the waitlist email it stores, with
      # claim_discipline.mjs reading that very file and finding nothing.
      #
      # This step never fails because of what a review found — findings print as
      # warnings and the release carries them. It fails when no review covers the
      # text about to ship, when the claim surfaces changed after the review was
      # written, or when the reviewer wrote `verdict: blocked`. Judgment wired to
      # an automatic red gets switched off at the first arguable finding, and the
      # findings worth having are arguable.
      #
      # confirm=registry is exempt: it corrects a metadata entry and publishes no
      # new claim.
      - name: Claims review gate
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: node test/denetci.mjs gate
      # Whether the release tag is free is knowable before npm publish, and npm
      # publish cannot be undone. Asking afterwards is how 0.2.25 ended up on npm
      # with nothing in the repository recording it; asking here costs a second.
      #
      # A tag that already points at this commit is fine — a re-dispatch after a
      # downstream failure lands there. A tag pointing at a different commit is
      # not: publishing would put this tree on npm under a number the repository
      # has already given to another one.
      - name: The release tag must be free
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          SHA="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            AT="$(git rev-parse "v${VERSION}^{commit}")"
            if [ "${AT}" != "${SHA}" ]; then
              echo "::error::v${VERSION} exists and points at ${AT}, not ${SHA}. Bump the version, or move the tag deliberately."
              exit 1
            fi
            echo "v${VERSION} already points at ${SHA}"
          else
            echo "v${VERSION} is free"
          fi
      # A published version with no release note is not a smaller release, it is
      # an unrecorded one. 0.2.33 went to npm on 2026-08-19 with a git tag, no
      # GitHub release, and a tarball whose newest changelog entry was 0.2.32 —
      # which is the very defect the 0.2.32 entry announced as fixed, recurring
      # one release later because the fix was an edit and not a mechanism.
      #
      # This is the mechanism. The release note is the changelog section, it is
      # required before anything irreversible happens, and the same text becomes
      # the GitHub release below, so the two cannot describe different releases.
      - name: The release must have a note
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          node .github/scripts/release-notes.mjs "$VERSION" --body > "$RUNNER_TEMP/notes.md"
          node .github/scripts/release-notes.mjs "$VERSION" --title > "$RUNNER_TEMP/title.txt"
          echo "release note: $(wc -l < "$RUNNER_TEMP/notes.md") lines, titled $(cat "$RUNNER_TEMP/title.txt")"
      # npm >= 11.5 exchanges the workflow's OIDC identity for a short-lived
      # publish credential. Nothing is stored in repo secrets.
      #
      # Pinned rather than `latest`, because `latest` means "whatever was
      # published to npm minutes ago, executed inside the one job that can
      # publish this package". Dependabot does not read version numbers out of a
      # run: script, so this one is bumped by hand — deliberately, since
      # dispatching a release is already a deliberate act and this file is part
      # of what gets read when it happens.
      - run: npm install -g npm@12.0.2
      - name: Publish with provenance
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: npm publish --access public --provenance
      # The tag records the npm release, so it is written as soon as that release
      # exists. It used to run last, behind the registry step, and on 0.2.25 that
      # ordering lost it: npm published, the registry rejected a stale
      # server.json, and the tag step never ran — leaving a version on npm that
      # the repository had no tag for, which is the one thing this step exists to
      # prevent. A metadata step failing downstream must not unrecord a release
      # that already happened.
      - name: Tag the release
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists, leaving it alone"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" -m "release ${VERSION}"
            git push origin "v${VERSION}"
          fi
      # ── the release artefact ─────────────────────────────────────────────
      #
      # A release page that offers a tarball is only useful if that tarball is
      # the one on npm. `npm pack` rebuilds it from this tree, which is a claim,
      # not a fact — so the claim is checked against the registry's own integrity
      # digest before anything is attested or uploaded. A mismatch means this
      # tree is not what was published and the step stops; it does not upload a
      # near-miss under the release's name.
      #
      # The digest is read back from npm rather than computed twice here: two
      # hand-made copies of one fact drift, and the copy that matters is the
      # registry's.
      - name: Pack the artefact and prove it is the published one
        id: artefact
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          SLUG="$(node -p "require('./package.json').name.replace('@','').replace('/','-')")"
          TARBALL="${RUNNER_TEMP}/${SLUG}-${VERSION}.tgz"
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          test -f "$TARBALL"
          LOCAL="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          # The registry needs a moment to serve a version it has just accepted.
          REMOTE=""
          for _ in 1 2 3 4 5; do
            REMOTE="$(npm view "${PKG}@${VERSION}" dist.integrity 2>/dev/null || true)"
            [ -n "$REMOTE" ] && break
            sleep 5
          done
          if [ -z "$REMOTE" ]; then
            echo "::error::npm did not report an integrity digest for ${PKG}@${VERSION}"
            exit 1
          fi
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::the tarball built here is not the one npm is serving"
            echo "  built:     $LOCAL"
            echo "  published: $REMOTE"
            exit 1
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sbom=${RUNNER_TEMP}/${SLUG}-${VERSION}.cdx.json" >> "$GITHUB_OUTPUT"
          echo "provenance=${RUNNER_TEMP}/${SLUG}-${VERSION}.tgz.intoto.jsonl" >> "$GITHUB_OUTPUT"
          echo "the release asset is byte-identical to the published package (${REMOTE})"
      # A governance product that cannot say what it is built from is asking its
      # buyers for more trust than it gives. `npm sbom` reads the installed tree
      # rather than re-resolving the manifest, so the bill of materials names the
      # versions this release was actually built and tested against.
      - name: Software bill of materials
        if: ${{ github.event.inputs.confirm == 'publish' }}
        run: |
          set -euo pipefail
          npm sbom --sbom-format cyclonedx --sbom-type library --omit dev \
            > "${{ steps.artefact.outputs.sbom }}"
          node -e "
            const s = require(process.argv[1])
            if (!s.components?.length) { console.error('sbom has no components'); process.exit(1) }
            console.log('sbom:', s.components.length, 'components,', s.bomFormat, s.specVersion)
          " "${{ steps.artefact.outputs.sbom }}"
      # npm's own provenance is written to the registry and its transparency log
      # by `npm publish --provenance` above, and is verified with `npm audit
      # signatures`. This is a second, separate attestation over the same bytes,
      # written to GitHub's attestation store — which is the store `gh
      # attestation verify` reads, and the reason that command used to answer 404
      # for this package. The bundle is attached to the release so the claim can
      # also be checked offline, without either service.
      - name: Attest the release artefact
        id: attest
        if: ${{ github.event.inputs.confirm == 'publish' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artefact.outputs.tarball }}
      - name: Create the GitHub release
        if: ${{ github.event.inputs.confirm == 'publish' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.artefact.outputs.provenance }}"
          # A re-dispatch after a downstream failure must not fail here on a
          # release that already exists — it should complete it.
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" \
              --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "v${VERSION}" --clobber \
              "${{ steps.artefact.outputs.tarball }}" \
              "${{ steps.artefact.outputs.sbom }}" \
              "${{ steps.artefact.outputs.provenance }}"
          else
            gh release create "v${VERSION}" \
              --title "$(cat "$RUNNER_TEMP/title.txt")" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${{ steps.artefact.outputs.tarball }}" \
              "${{ steps.artefact.outputs.sbom }}" \
              "${{ steps.artefact.outputs.provenance }}"
          fi
          gh release view "v${VERSION}" --json assets \
            --jq '.assets[] | "  asset: \(.name) (\(.size) bytes)"'
      # The registry stores metadata, not artefacts, so it runs after npm has
      # the package: it checks that the published tarball's mcpName matches
      # server.json before it will accept the server. github-oidc reuses this
      # job's identity — no token, and the namespace it grants
      # (io.github.<owner>/) is the one server.json asks for.
      # This job holds the npm publish identity, so nothing unverified runs in
      # it: the publisher is pinned to a release and its digest is checked
      # before extraction, the same discipline the Actions above get from SHA
      # pinning. `latest` would let a replaced asset execute here.
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          curl -sSLf -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
